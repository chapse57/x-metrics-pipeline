[project]
name = "xmetrics"
version = "0.1.0"
description = "Measure X (Twitter) account engagement from a logged-in timeline, classify with an LLM behind guardrails, validate, and ship CSV + dashboard."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "playwright>=1.45"]

[project.optional-dependencies]
dev = ["pytest>=8"]
pg = ["psycopg[binary]>=3.1"]
api = ["psycopg[binary]>=3.1", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[project.scripts]
xmetrics = "xmetrics.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["xmetrics"]
